<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">الدقة وقت التعويض</title><desc id="desc">القيمة المستخدمة؛ ثم الإشارة الصحيحة؛ ثم الوحدة المطلوبة؛ ثم انتباه داخل نفس الحل</desc>
<rect width="1080" height="1350" fill="#101f2b"/>
<g font-family="Arial, sans-serif" text-anchor="middle" direction="rtl">
<text x="540" y="94" fill="#7fe1bb" font-size="30">مذاكراوي • نوفمبر ٢٠٢٦</text>
<text x="540" y="182" fill="#fff5e5" font-size="48" font-weight="bold">الدقة وقت التعويض</text>
<rect x="90" y="310" width="900" height="155" rx="24" fill="#f7f2e8"/>
<text x="540" y="375" fill="#102c35" font-size="40">القيمة المستخدمة</text>
<path d="M540 475 v25 m-12 -12 l12 12 12 -12" stroke="#7fe1bb" fill="none" stroke-width="5"/>
<rect x="90" y="515" width="900" height="155" rx="24" fill="#f7f2e8"/>
<text x="540" y="580" fill="#102c35" font-size="40">الإشارة الصحيحة</text>
<path d="M540 680 v25 m-12 -12 l12 12 12 -12" stroke="#7fe1bb" fill="none" stroke-width="5"/>
<rect x="90" y="720" width="900" height="155" rx="24" fill="#f7f2e8"/>
<text x="540" y="785" fill="#102c35" font-size="40">الوحدة المطلوبة</text>
<path d="M540 885 v25 m-12 -12 l12 12 12 -12" stroke="#7fe1bb" fill="none" stroke-width="5"/>
<rect x="90" y="925" width="900" height="155" rx="24" fill="#f7f2e8"/>
<text x="540" y="990" fill="#102c35" font-size="40">انتباه داخل نفس الحل</text>
<text x="540" y="1225" fill="#fff5e5" font-size="31">داخل المهمة الموجودة في جدولك</text>
<text x="540" y="1280" fill="#7fe1bb" font-size="28">أفضل أداء متاح • من غير تكليف إضافي</text>
</g></svg>